name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run generate:contracts

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Enforce contract authority
        run: npm run check:contract-authority

      - name: Enforce generated artifact freshness
        run: npm run check:generated-contracts

