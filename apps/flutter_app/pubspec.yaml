name: nexus_tales
description: Nexus Tales - Production-grade Flutter AI Narrative RPG client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod: ^2.6.0
  riverpod_generator: ^2.6.0

  # Routing
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0

  # Data & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  http: ^1.1.0

  # Utils
  intl: ^0.20.0
  equatable: ^2.0.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/art/

